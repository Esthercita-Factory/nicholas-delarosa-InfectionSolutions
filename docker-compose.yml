# InfectionSolutions completo: pruebas -> base de datos, API, panel y portal de clientes.
#
#   docker compose up --build
#
# 1. "tests" corre las pruebas xUnit. Si alguna falla, el contenedor sale con codigo != 0
#    y compose NO levanta nada mas (todos dependen de service_completed_successfully).
# 2. Si pasan: PostgreSQL, y cuando esta lista, la API y el panel; despues el portal.
#
#   Panel administrativo:  http://localhost:8080   (admin@infection.com / Admin123*)
#   API (Swagger):         http://localhost:8081/swagger
#   Portal de clientes:    http://localhost:8082
#
# Cada servicio tiene su imagen publicada en GHCR (la publica GitHub Actions en cada push)
# y tambien se puede construir desde el codigo. En el servidor: "docker compose pull" y
# "docker compose up -d" (ver docs/despliegue.md). Puertos y secretos: archivo .env.

name: infectionsolutions

services:
  tests:
    build:
      context: .
      dockerfile: Src/InfectionSolutions.Tests/Dockerfile
    image: infectionsolutions-tests:local
    # La imagen de pruebas no se publica: siempre se construye desde el codigo.
    pull_policy: build
    restart: "no"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infection_solutions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Sin "ports": la base solo es visible para los contenedores de este proyecto.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-infection_solutions}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${API_IMAGE:-ghcr.io/esthercita-factory/nicholas-delarosa-infectionsolutions-api:latest}
    build:
      context: .
      dockerfile: Src/InfectionSolutions.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-infection_solutions};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      SeedAdmin__Email: ${ADMIN_EMAIL:-admin@infection.com}
      SeedAdmin__Password: ${ADMIN_PASSWORD:-Admin123*}
      # 32+ caracteres. El valor por defecto es solo para probar en local: en un
      # servidor define JWT_SIGNING_KEY en .env (copia .env.example).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-compose-local-no-usar-en-produccion-0123456789}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Cors__AllowedOrigins__0: ${CLIENT_ORIGIN:-http://localhost:4200}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      # Direccion publica del portal: los enlaces de los correos y la vuelta de Google/GitHub.
      Portal__BaseUrl: ${PORTAL_URL:-http://localhost:8082}
      # Inicio de sesion con Google y GitHub: vacios = boton oculto (ver docs/despliegue.md).
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      # Mismo volumen que el panel: un recibo generado en un lado se ve en el otro.
      - receipts:/app/App_Data/recibos
      # Llaves de Data Protection: sin esto, recrear el contenedor invalida los enlaces de
      # recuperacion de contraseña ya enviados.
      - api-keys:/app/App_Data/keys

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/esthercita-factory/nicholas-delarosa-infectionsolutions-admin:latest}
    build:
      context: .
      dockerfile: Src/InfectionSolutions.Admin/Dockerfile
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-infection_solutions};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      SeedAdmin__Email: ${ADMIN_EMAIL:-admin@infection.com}
      SeedAdmin__Password: ${ADMIN_PASSWORD:-Admin123*}
      # Datos de demostracion (12 productos, 12 clientes y ventas) solo si la base esta vacia.
      SeedDemoData: ${SEED_DEMO_DATA:-true}
      # Correo del "olvide mi contraseña" de los administradores.
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - receipts:/app/wwwroot/recibos
      - import-logs:/app/App_Data/import-logs
      # Llaves de cookies y antiforgery: sin esto, recrear el contenedor cierra las sesiones.
      - admin-keys:/home/app/.aspnet/DataProtection-Keys

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/esthercita-factory/nicholas-delarosa-infectionsolutions.client:latest}
    build:
      # El portal vive en su propio repositorio, clonado al lado de este
      # (../InfectionSolutions.Client). Si no se va a construir, basta con la imagen de GHCR.
      context: ${CLIENT_BUILD_CONTEXT:-../InfectionSolutions.Client}
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      # Nginx reenvia /api a este destino: portal y API quedan en el mismo origen.
      API_UPSTREAM: http://api:8080
    ports:
      - "${CLIENT_PORT:-8082}:8080"

volumes:
  db-data:
  receipts:
  import-logs:
  admin-keys:
  api-keys:
